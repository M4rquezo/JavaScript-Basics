<!--
Todo archivo HTML5 comienza con una estructura mínima: 
declara que se usa HTML5. 
es el contenedor raíz. 
incluye metadatos, título y enlaces a estilos/scripts. 
contiene el contenido visible. 
-->


<!--HTML5 introdujo etiquetas que describen mejor el contenido-->
<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--navegación principal-->. 
    <script type="text/Javascript" src="main.js"> //contenido independiente para tener orden dividir e invocar con src
    </script> 
    
    <title> 1er Programa JS </title> <!--encabezado de página o sección--> 
</head>
<body>

    <h1>Primeros pasos con Javascript</h1> //  <!--contenido complementario.--> 

    
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

    <script src="ejercicio37.js" defer></script>
   
    <title> E37 JS </title>

</head>
<body>

    <h1> Ejercicio 37 Con JavaScript - David Marquez</h1>
   
    <form action="#" method="post" id="formulario">

    <label for="nombre">Nombre: </label> <br/> <!-- Nombre del input  -->  
    <input type="text" id="nombre" name="nombre" /> <br/>  <!--  espacio para escribir -->
        
    <label for="apellidos"> Apellidos:</label> <br/>
    <input type="text" id="apellidos" name="apellidos" /> <br/>

    <label for="edad">Edad: </label> <br/> 
    <input type="text" id="edad" name="edad" /><br/>

    <input type="submit" id="submit" value="Enviar" /><br/>
       <!--  Boton para enviar formulario -->
         
</form>

<div class="info">
    <h3> Informacion del USUARIO </h3>

    <p id="info_nombre">
        Nombre:  <strong></strong>
    </p>

    <p id="info_apellidos">

    </p>

    <p id="info_edad">
        Edad:  <strong></strong>
    </p>

</div>
